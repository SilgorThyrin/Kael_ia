<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kael AI</title>
  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --surface-2: #282a2c;
      --border: #333537;
      --text: #e3e3e3;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --accent-bg: rgba(138, 180, 248, 0.16);
      --user-bg: #282a2c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Topbar */
    .topbar {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2022;
      background: var(--bg);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn.active { color: var(--accent); background: var(--accent-bg); }
    .chat-title { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
    .topbar-right { display: flex; align-items: center; gap: 6px; }

    /* Quick drawer */
    .drawer {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .drawer.open { display: flex; }
    .quick-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
    }

    /* Messages area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .msg-row { display: flex; flex-direction: column; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg-user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 20px 20px 4px 20px;
      max-width: 85%;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-bot {
      align-self: flex-start;
      width: 100%;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
    }
    .thinking-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .thinking-box summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 500;
      user-select: none;
    }
    .thinking-content {
      margin-top: 6px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .bot-body p { margin-bottom: 10px; }
    .bot-body ul, .bot-body ol { margin: 6px 0 12px 20px; }
    .bot-body li { margin-bottom: 4px; }
    .bot-body code {
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 13.5px;
    }
    .bot-body pre {
      background: #0d0e10;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .bot-body pre code { background: transparent; padding: 0; }
    .table-wrap {
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      vertical-align: top;
    }
    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    th { background: #232527; font-weight: 600; color: #fff; }

    /* Message action bar (like screenshot) */
    .msg-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      color: var(--muted);
    }
    .msg-actions button {
      background: transparent;
      border: none;
      color: var(--muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .msg-actions button:hover { background: var(--surface-2); color: var(--text); }
    .msg-actions .spacer { flex: 1; }

    /* Status bar */
    #statusBar {
      display: none;
      max-width: 820px;
      width: calc(100% - 28px);
      margin: 0 auto 6px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--accent);
      align-items: center;
      justify-content: space-between;
    }
    #statusBar.visible { display: flex; }
    #btnCancel {
      background: #3b2323;
      color: #ffb4ab;
      border: 1px solid #5c3333;
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Bottom pill composer */
    .composer-wrap {
      padding: 8px 12px 14px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .composer {
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #promptInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15.5px;
      resize: none;
      max-height: 140px;
      line-height: 1.4;
      font-family: inherit;
    }
    #promptInput::placeholder { color: var(--muted); }
    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .chips-left { display: flex; align-items: center; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }
    .actions-right { display: flex; align-items: center; gap: 8px; }
    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .circle-btn.primary {
      background: var(--accent);
      color: #131314;
      border-color: var(--accent);
    }
    .circle-btn.recording {
      background: #ea4335;
      color: #fff;
      border-color: #ea4335;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btnMenu" title="Atalhos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="14" y2="16"/></svg>
      </button>
      <span class="chat-title">Kael AI</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btnAutoTts" title="Fala automática">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <button class="icon-btn" id="btnNewChat" title="Nova conversa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div class="drawer" id="quickDrawer">
    <button class="quick-pill" onclick="enviarRapido('Revisa todos os codigos')">Revisar Kael_ia</button>
    <button class="quick-pill" onclick="enviarRapido('Inspecione o projeto Ecos de Aethelgard')">Ecos de Aethelgard</button>
    <button class="quick-pill" onclick="enviarRapido('Listar pastas em /storage/emulated/0')">Pastas do Celular</button>
    <button class="quick-pill" onclick="enviarRapido('Procurar vírus')">Varredura Local</button>
  </div>

  <main id="messages"></main>

  <div id="statusBar">
    <span id="statusText">Pensando...</span>
    <button id="btnCancel" onclick="cancelarTurno()">Cancelar</button>
  </div>

  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="promptInput" rows="1" placeholder="Mensagem ou segure para falar"></textarea>
      <div class="composer-bar">
        <div class="chips-left">
          <button class="chip active" id="chipPensar" onclick="toggleChip('pensar')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            Pensar
          </button>
          <button class="chip" id="chipPesquisar" onclick="toggleChip('pesquisar')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            Pesquisar
          </button>
        </div>
        <div class="actions-right">
          <button class="circle-btn" title="Listar pastas" onclick="enviarRapido('Listar pastas em /storage/emulated/0')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="circle-btn" id="btnMicSend" title="Falar ou Enviar">
            <svg id="iconMic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const state = { pensar: true, pesquisar: false, autoTts: false, lastPrompt: "", abortCtrl: null, ttsBuffer: "" };
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("promptInput");
    const btnMicSend = document.getElementById("btnMicSend");

    document.getElementById("btnMenu").onclick = () => document.getElementById("quickDrawer").classList.toggle("open");
    document.getElementById("btnAutoTts").onclick = (e) => {
      state.autoTts = !state.autoTts;
      e.currentTarget.classList.toggle("active", state.autoTts);
      if (!state.autoTts && "speechSynthesis" in window) speechSynthesis.cancel();
    };
    document.getElementById("btnNewChat").onclick = () => {
      messagesEl.innerHTML = "";
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    };

    function toggleChip(nome) {
      state[nome] = !state[nome];
      document.getElementById(nome === "pensar" ? "chipPensar" : "chipPesquisar").classList.toggle("active", state[nome]);
    }

    function atualizarBotaoEnvio() {
      const temTexto = inputEl.value.trim().length > 0;
      btnMicSend.classList.toggle("primary", temTexto);
      btnMicSend.innerHTML = temTexto
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>';
    }

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
      atualizarBotaoEnvio();
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (inputEl.value.trim()) enviar();
      }
    });

    btnMicSend.addEventListener("click", () => {
      if (inputEl.value.trim()) {
        enviar();
      } else {
        iniciarVoz();
      }
    });

    function iniciarVoz() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert("Reconhecimento de voz não disponível neste navegador.");
        return;
      }
      const rec = new SR();
      rec.lang = "pt-BR";
      rec.interimResults = false;
      btnMicSend.classList.add("recording");
      rec.onresult = (ev) => {
        const txt = ev.results[0][0].transcript;
        inputEl.value = txt;
        atualizarBotaoEnvio();
        enviar(txt, true);
      };
      rec.onerror = () => btnMicSend.classList.remove("recording");
      rec.onend = () => btnMicSend.classList.remove("recording");
      rec.start();
    }

    function falarTexto(texto, interromper = true) {
      if (!("speechSynthesis" in window) || !texto.trim()) return;
      if (interromper) speechSynthesis.cancel();
      const limpo = texto.replace(/```[\s\S]*?```/g, " bloco de código ").replace(/[*#`|>_-]/g, " ");
      const utt = new SpeechSynthesisUtterance(limpo);
      utt.lang = "pt-BR";
      utt.rate = 1.05;
      speechSynthesis.speak(utt);
    }

    function falarStreamChunk(delta) {
      if (!state.autoTts) return;
      state.ttsBuffer += delta;
      const match = state.ttsBuffer.match(/^([\s\S]*?[.!?\n])([\s\S]*)$/);
      if (match) {
        falarTexto(match[1], false);
        state.ttsBuffer = match[2];
      }
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdown(md) {
      let html = escHtml(md || "");
      // Code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
      // Markdown tables
      html = html.replace(/(?:^\|.+\|\s*\n)+/gm, (bloco) => {
        const linhas = bloco.trim().split("\n").filter(Boolean);
        if (linhas.length < 2) return bloco;
        const parseRow = (r) => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        const headers = parseRow(linhas[0]);
        const bodyRows = linhas.slice(1).filter(l => !/^\|[\s:-]+\|$/.test(l.trim())).map(parseRow);
        let t = '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>';
        for (const row of bodyRows) {
          t += "<tr>" + row.map(c => `<td>${c}</td>`).join("") + "</tr>";
        }
        t += "</tbody></table></div>";
        return t;
      });
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
      html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
      html = html.replace(/\n{2,}/g, "</p><p>");
      return `<p>${html}</p>`;
    }

    function criarBolhaBot() {
      const row = document.createElement("div");
      row.className = "msg-row";
      row.innerHTML = `
        <div class="msg-bot">
          <details class="thinking-box" open style="display:none">
            <summary>Pensando...</summary>
            <div class="thinking-content"></div>
          </details>
          <div class="bot-body"></div>
          <div class="msg-actions" style="display:none">
            <button title="Copiar" data-act="copy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            <button title="Gostei" data-act="like"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
            <button title="Não gostei" data-act="dislike"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>
            <button title="Ouvir" data-act="speak"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
            <div class="spacer"></div>
            <button title="Regenerar" data-act="regen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
          </div>
        </div>`;
      messagesEl.appendChild(row);
      return row;
    }

    function enviarRapido(txt) {
      inputEl.value = txt;
      atualizarBotaoEnvio();
      enviar(txt, false);
    }

    async function cancelarTurno() {
      if (state.abortCtrl) state.abortCtrl.abort();
      try { await fetch("/chat/cancel", { method: "POST" }); } catch (_) {}
      document.getElementById("statusBar").classList.remove("visible");
    }

    async function enviar(textoCustom = null, modoVoz = false) {
      const msg = (textoCustom !== null ? textoCustom : inputEl.value).trim();
      if (!msg) return;
      state.lastPrompt = msg;
      state.ttsBuffer = "";
      if (modoVoz) state.autoTts = true;

      if (textoCustom === null) {
        inputEl.value = "";
        inputEl.style.height = "auto";
        atualizarBotaoEnvio();
      }

      const uRow = document.createElement("div");
      uRow.className = "msg-row";
      uRow.innerHTML = `<div class="msg-user">${escHtml(msg)}</div>`;
      messagesEl.appendChild(uRow);

      const botRow = criarBolhaBot();
      const thinkBox = botRow.querySelector(".thinking-box");
      const thinkBody = botRow.querySelector(".thinking-content");
      const botBody = botRow.querySelector(".bot-body");
      const actionsBar = botRow.querySelector(".msg-actions");

      const statusBar = document.getElementById("statusBar");
      const statusText = document.getElementById("statusText");
      statusBar.classList.add("visible");
      const t0 = Date.now();
      const timer = setInterval(() => {
        statusText.textContent = `Trabalhando... ${Math.floor((Date.now() - t0) / 1000)}s`;
      }, 500);

      let rawContent = "";
      state.abortCtrl = new AbortController();

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: state.abortCtrl.signal,
          body: JSON.stringify({
            message: msg,
            think: state.pensar,
            web_search: state.pesquisar,
            voice_mode: modoVoz
          })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const raw = line.slice(5).trim();
            if (!raw || raw === "[DONE]") continue;
            let ev;
            try { ev = JSON.parse(raw); } catch (_) { continue; }
            const chunk = ev.delta ?? ev.text ?? "";
            if (ev.type === "thinking" && state.pensar) {
              thinkBox.style.display = "block";
              thinkBody.textContent += chunk;
            } else if (ev.type === "content") {
              rawContent += chunk;
              botBody.innerHTML = renderMarkdown(rawContent);
              falarStreamChunk(chunk);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        }
      } catch (err) {
        if (!rawContent) {
          botBody.innerHTML = renderMarkdown(`Falha na conexão: ${err.message}`);
        }
      } finally {
        clearInterval(timer);
        statusBar.classList.remove("visible");
        if (state.ttsBuffer.trim()) {
          falarTexto(state.ttsBuffer, false);
          state.ttsBuffer = "";
        }
        actionsBar.style.display = "flex";
        actionsBar.querySelector('[data-act="copy"]').onclick = () => navigator.clipboard?.writeText(rawContent);
        actionsBar.querySelector('[data-act="speak"]').onclick = () => falarTexto(rawContent, true);
        actionsBar.querySelector('[data-act="regen"]').onclick = () => enviarRapido(state.lastPrompt);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
  </script>

  <div id="permModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:999;align-items:center;justify-content:center;padding:16px;">
    <div style="background:#1e1f20;border:1px solid #3c4043;border-radius:20px;max-width:420px;width:100%;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,0.5);">
      <div style="font-size:16px;font-weight:600;color:#fff;margin-bottom:8px;">Permissão de Acesso Local</div>
      <div id="permModalText" style="font-size:14px;color:#bdc1c6;line-height:1.45;margin-bottom:18px;">
        O Kael precisa de autorização para acessar o armazenamento compartilhado (/storage/emulated/0).
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="fecharPermModal()" style="background:#282a2c;border:1px solid #3c4043;color:#e3e3e3;padding:8px 16px;border-radius:999px;cursor:pointer;">Negar</button>
        <button onclick="autorizarPermModal()" style="background:#8ab4f8;border:none;color:#131314;font-weight:600;padding:8px 18px;border-radius:999px;cursor:pointer;">Permitir</button>
      </div>
    </div>
  </div>
  <script>
    let _permCallback = null;
    function abrirPermModal(texto, cb) {
      document.getElementById("permModalText").textContent = texto;
      _permCallback = cb;
      document.getElementById("permModal").style.display = "flex";
    }
    function fecharPermModal() {
      document.getElementById("permModal").style.display = "none";
      _permCallback = null;
    }
    function autorizarPermModal() {
      const fn = _permCallback;
      fecharPermModal();
      if (typeof fn === "function") fn();
    }
    // Observa novas mensagens para disparar o pop-up automaticamente quando houver bloqueio/pedido de permissão
    const _obsPerm = new MutationObserver(() => {
      const bots = document.querySelectorAll(".bot-body");
      if (!bots.length) return;
      const ultimo = bots[bots.length - 1];
      if (ultimo.dataset.permChecked) return;
      const txt = ultimo.textContent || "";
      if (txt.includes("Scoped Storage") || txt.includes("Permissão negada") || txt.includes("permissão")) {
        ultimo.dataset.permChecked = "1";
        abrirPermModal(
          "O Android restringe a raiz /storage. Deseja autorizar a leitura direta de /storage/emulated/0?",
          () => enviarRapido("Listar pastas em /storage/emulated/0")
        );
      }
    });
    _obsPerm.observe(document.getElementById("messages"), { childList: true, subtree: true });
  </script>
</body>
</html>
