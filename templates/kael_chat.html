<script>
window.addEventListener("error", function(e) {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#991b1b;color:#fff;padding:10px;font-size:13px;font-family:monospace;";
  d.textContent = "ERRO JS: " + (e.message || e) + " (linha " + (e.lineno || "?") + ")";
  document.body ? document.body.prepend(d) : document.addEventListener("DOMContentLoaded", () => document.body.prepend(d));
});
</script>
  <meta charset="UTF-8" />

  <title>Kael AI — Studio &amp; Code</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #388bfd;
      --user-bg: #1d3557;
      --code-bg: #090c10;
      --ok: #3fb950;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    #prompt {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      resize: none;
    }
    #prompt:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.25);
    }
    #send {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #send:hover {
      background: var(--accent-hover);
    }
    #send:active {
      transform: scale(0.97);
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button.chip {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    button.chip:hover {
      border-color: var(--accent);
      background: #26303d;
    }
    .target-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .target-bar label {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .target-bar input {
      flex: 1;
      min-width: 180px;
      background: var(--code-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
    main#chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      line-height: 1.5;
      font-size: 0.94rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      background: var(--user-bg);
      border-color: #2c5282;
    }
    .msg .role {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
    }
    .copy-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.74rem;
      cursor: pointer;
      float: right;
    }
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
    }
    .composer {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    textarea#prompt {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      line-height: 1.4;
      background: var(--code-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    textarea#prompt:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    button#send {

      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;

      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;

    .btn-reject {

      color: #090c10;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;

  <script>
    const chatEl = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const alvoEl = document.getElementById("alvoPath");

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatarConteudo(texto) {
      const parts = texto.split("```");
      let html = "";
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          let bloco = parts[i];
          const firstNL = bloco.indexOf("\n");
          if (firstNL > -1 && firstNL < 20) {
            bloco = bloco.slice(firstNL + 1);
          }
          const id = "code_" + Math.random().toString(36).slice(2, 8);
          html += `<pre><button class="copy-btn" onclick="copiarBloco('${id}', this)">Copiar</button><code id="${id}">${escapeHtml(bloco.trim())}</code></pre>`;
        } else {
          html += `<span>${escapeHtml(parts[i])}</span>`;
        }
      }
      return html;
    }

    function copiarBloco(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.innerText).then(() => {
        const orig = btn.innerText;
        btn.innerText = "Copiado";
        setTimeout(() => (btn.innerText = orig), 1200);
      });
    }

    function adicionarMensagem(role, texto) {
      const box = document.createElement("div");
      box.className = `msg ${role}`;
      const label = role === "user" ? "Você" : "Kael";
      box.innerHTML = `<div class="role"><span>${label}</span><span></span></div><div>${formatarConteudo(texto)}</div>`;
      chatEl.appendChild(box);
      chatEl.scrollTop = chatEl.scrollHeight;
      return box;
    }

    function limparChat() {
      chatEl.innerHTML = "";
      adicionarMensagem("assistant", "Chat limpo. Como posso ajudar agora?");
    }

    

    async function enviar(textoCustom) {
      const texto = (textoCustom ?? promptEl.value).trim();
      if (!texto) return;

      if (!textoCustom) {
        promptEl.value = "";
        promptEl.style.height = "44px";
      }

      adicionarMensagem("user", texto);
      const loading = adicionarMensagem("assistant", "Pensando...");
      sendBtn.disabled = true;

      try {
        
        let streamedThinking = "";
        let streamedContent = "";
        const msgBody = loading.querySelector("div:last-child");
        msgBody.innerHTML = `<details style="display:none;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:rgba(128,128,128,0.12);font-size:0.85em;"><summary style="cursor:pointer;opacity:0.85;">Pensando...</summary><div class="kael-live-thinking" style="white-space:pre-wrap;margin-top:6px;opacity:0.8;"></div></details><div class="kael-live-content">Pensando...</div>`;
        const thkEl = msgBody.querySelector(".kael-live-thinking");
        const cntEl = msgBody.querySelector(".kael-live-content");
        const streamResp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensagem: texto, prompt: texto, pasta: alvoEl.value.trim() }),
        });
        if (streamResp.ok && streamResp.body) {
          const reader = streamResp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
              const clean = line.replace(/^data:\s*/, "").trim();
              if (!clean || clean === "[DONE]") continue;
              try {
                const ev = JSON.parse(clean);
                if (ev.type === "thinking") {
                  const d = (ev.delta ?? ev.text ?? "");
                  if (d.trim()) {
                    const detailsEl = msgBody.querySelector("details");
                    if (detailsEl) {
                      detailsEl.style.display = "block";
                      if (!streamedContent) detailsEl.open = true;
                    }
                  }
                  streamedThinking += d;
                  thkEl.textContent = streamedThinking;
                } else if (ev.type === "content" || ev.type === "error") {
                  const detailsEl = msgBody.querySelector("details");
                  if (detailsEl && !streamedContent) detailsEl.open = false;
                  if (!streamedContent) cntEl.innerHTML = "";
                  streamedContent += (ev.delta ?? ev.text ?? "");
                  cntEl.innerHTML = formatarConteudo(streamedContent);
                }
                chatEl.scrollTop = chatEl.scrollHeight;
              } catch (_) {}
            }
          }
          await dispararPopupDeTexto(streamedContent);
          return;
        }
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mensagem: texto,
            prompt: texto,
            pasta: alvoEl.value.trim(),
          }),
        });
        const rawText = await resp.text();
        const trimmed = rawText.trim();
        let saida = "";

        if (trimmed.startsWith("<") || trimmed.toLowerCase().startsWith("<!doctype")) {
          saida = `[HTTP ${resp.status}] O servidor retornou HTML em vez de JSON para /chat.\n` + trimmed.slice(0, 350);
        } else {
          try {
            const data = JSON.parse(rawText);
            saida = data.response || data.resposta || data.reply || data.error || JSON.stringify(data, null, 2);
          } catch (e) {
            saida = `[HTTP ${resp.status}] JSON inválido (${e.message}):\n` + trimmed.slice(0, 350);
          }
        }

        loading.querySelector("div:last-child").innerHTML = formatarConteudo(String(saida));
        await dispararPopupDeTexto(saida);
      } catch (err) {
        loading.querySelector("div:last-child").innerText = "Erro ao conectar com o servidor do Kael: " + err.message;
      } finally {
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    }

    promptEl.addEventListener("keydown", (e) => {

    async function dispararPopupDeTexto(textoResposta) {
      const t = String(textoResposta || "");
      if (!/a[cç][aã]o pendente|deseja confirmar|confirmar a remo[cç][aã]o|rodar o comando/i.test(t)) {
        return;
      }
      const matchCmd = t.match(/`([^`]+)`/);
      const alvo = matchCmd ? matchCmd[1] : (alvoEl.value.trim() || "~/Kael_ia");
      try {
        await fetch("/kael-perm/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            acao: "Confirmar ação do Kael",
            alvo: alvo,
            detalhes: t.slice(0, 350),
          }),
        });
        checarPermissoes();
      } catch (_) {}
    }

    let permissaoAtual = null;

    async function checarPermissoes() {
      if (permissaoAtual) return;
      try {
        const r = await fetch("/kael-perm/pending");
        if (!r.ok) return;
        const data = await r.json();
        const fila = data.pending || [];
        if (fila.length > 0) {
          permissaoAtual = fila[0];
          document.getElementById("permAlvo").innerText =
            `Ação: ${permissaoAtual.acao} | Alvo: ${permissaoAtual.alvo}`;
          document.getElementById("permDetalhes").innerText =
            permissaoAtual.detalhes || "Confirme se deseja autorizar esta ação.";
          document.getElementById("permModal").classList.add("active");
        }
      } catch (_) {}
    }

    async function responderPermissao(aceitar) {
      if (!permissaoAtual) return;
      const atual = permissaoAtual;
      const id = atual.id;
      permissaoAtual = null;
      document.getElementById("permModal").classList.remove("active");

      let resData = null;
      try {
        const r = await fetch("/kael-perm/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, accept: aceitar }),
        });
        if (r.ok) {
          resData = await r.json();
        }
      } catch (err) {
        if (typeof chatEl !== "undefined" && chatEl) {
          chatEl.innerHTML += `<div class="msg assistant"><b>Kael:</b> Falha ao resolver permissão: ${escapeHtml(String(err.message || err))}</div>`;
        }
      }

      if (aceitar) {
        const regResp = resData && resData.registry_result && resData.registry_result.response;
        const fmt = (typeof formatarConteudo === "function")
          ? formatarConteudo
          : (txt) => escapeHtml(String(txt)).replace(/\n/g, "<br>");

        if (regResp) {
          if (typeof chatEl !== "undefined" && chatEl) {
            chatEl.innerHTML += `<div class="msg assistant"><b>Kael:</b> ${fmt(regResp)}</div>`;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } else {
          const statusId = "kael-perm-status-" + Date.now();
          if (typeof chatEl !== "undefined" && chatEl) {
            chatEl.innerHTML += `<div id="${statusId}" class="msg assistant"><b>Kael:</b> ✅ Permissão aceita (${escapeHtml(String(id))}). Aguardando resposta do Kael...</div>`;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
          const alvoMsg = atual.alvo ? " no alvo `" + atual.alvo + "`" : "";
          const promptConfirmacao = `Permissão ACEITA para "${atual.acao || "ação pendente"}"${alvoMsg}. Execute agora a ação solicitada e mostre o resultado.`;
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 25000);
          try {
            const cResp = await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              signal: ctrl.signal,
              body: JSON.stringify({
                mensagem: promptConfirmacao,
                prompt: promptConfirmacao,
                pasta: (typeof alvoEl !== "undefined" && alvoEl && alvoEl.value ? alvoEl.value.trim() : "") || atual.alvo || "",
              }),
            });
            clearTimeout(timer);
            const cText = await cResp.text();
            let replyText = cText;
            try {
              const cData = JSON.parse(cText);
              replyText = cData.reply || cData.response || cData.resposta || cData.error || JSON.stringify(cData);
            } catch (_) {}

            const stEl = document.getElementById(statusId);
            if (stEl) {
              stEl.innerHTML = `<b>Kael:</b> ${fmt(replyText)}`;
            } else if (typeof chatEl !== "undefined" && chatEl) {
              chatEl.innerHTML += `<div class="msg assistant"><b>Kael:</b> ${fmt(replyText)}</div>`;
            }
            if (typeof chatEl !== "undefined" && chatEl) {
              chatEl.scrollTop = chatEl.scrollHeight;
            }
          } catch (err) {
            clearTimeout(timer);
            const stEl = document.getElementById(statusId);
            const detalheErr = err.name === "AbortError" ? "Tempo limite de 25s atingido ao aguardar /chat." : String(err.message || err);
            const msgErr = `<b>Kael:</b> Permissão aceita, mas ${escapeHtml(detalheErr)}`;
            if (stEl) stEl.innerHTML = msgErr;
            else if (typeof chatEl !== "undefined" && chatEl) chatEl.innerHTML += `<div class="msg assistant">${msgErr}</div>`;
          }
        }
      }
      checarPermissoes();
    }

    setInterval(function() {
      if (!document.hidden && typeof checarPermissoes === "function") {
        checarPermissoes();
      }
    }, 12000);
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden && typeof checarPermissoes === "function") {
        checarPermissoes();
      }
    });
    checarPermissoes();


    let _kaelRec = null;
    let _kaelOuvindo = false;

    function alternarVoz() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const btn = document.getElementById("micBtn");
      const ta = document.getElementById("prompt");
      if (!SR) {
        if (ta) {
          ta.placeholder = "Voz indisponível neste navegador; digite normalmente.";
        }
        return;
      }
      if (_kaelOuvindo && _kaelRec) {
        _kaelRec.stop();
        return;
      }
      const rec = new SR();
      rec.lang = "pt-BR";
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        _kaelOuvindo = true;
        if (btn) btn.innerText = "Ouvindo...";
      };
      rec.onresult = (ev) => {
        let transcricao = "";
        for (let i = 0; i < ev.results.length; i++) {
          transcricao += ev.results[i][0].transcript;
        }
        if (ta) {
          ta.value = transcricao;
          ta.dispatchEvent(new Event("input", { bubbles: true }));
        }
      };
      rec.onerror = () => {
        _kaelOuvindo = false;
        if (btn) btn.innerText = "Voz";
      };
      rec.onend = () => {
        _kaelOuvindo = false;
        if (btn) btn.innerText = "Voz";
      };

      _kaelRec = rec;
      rec.start();
    }

const KAEL_HIST_KEY = "kael_chat_historico_v1";

function _lerHistoricoLocal() {
  try {
    const raw = localStorage.getItem(KAEL_HIST_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.slice(-50) : [];
  } catch (_) {
    return [];
  }
}

function _salvarHistoricoLocal(arr) {
  try {
    localStorage.setItem(KAEL_HIST_KEY, JSON.stringify((arr || []).slice(-50)));
  } catch (_) {}
}

function registrarMensagemHistorico(role, content) {
  if (!content || !String(content).trim()) return;
  const arr = _lerHistoricoLocal();
  arr.push({ role: role === "user" ? "user" : "assistant", content: String(content).trim() });
  _salvarHistoricoLocal(arr);
}

function enviarResumoAutomatico(userTxt, assistantTxt) {

    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: userTxt || "", assistant: assistantTxt || "" })
  }).catch(() => {});

  const arr = _lerHistoricoLocal();
  if (!arr.length) return;
  const box = document.querySelector("#chat, #messages, .chat-box, .messages");
  if (!box || box.children.length > 0) return;
  for (const m of arr) {

    div.style.padding = "10px 12px";

<!-- KAEL_AUTO_HISTORICO_UI -->
<script>
(function() {
  function acharContainerChat() {
    const seletores = [
      "#messages", "#chat-messages", "#chat-box", "#chatLog", "#chat-log",
      "[data-chat-messages]", ".chat-messages", ".messages", "#chat"
    ];
    for (const sel of seletores) {
      const el = document.querySelector(sel);
      if (el && el.tagName !== "FORM" && el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") {
        return el;
      }
    }
    return null;
  }

  function criarBolha(role, content) {
    const div = document.createElement("div");
    div.className = "kael-hist-msg " + (role === "user" ? "msg-user user" : "msg-assistant assistant");
    div.dataset.kaelHist = "1";
    div.style.margin = "8px 0";
    div.style.padding = "10px 12px";
    div.style.borderRadius = "10px";
    div.style.whiteSpace = "pre-wrap";
    div.style.wordBreak = "break-word";
    if (role === "user") {
      div.style.background = "rgba(59, 130, 246, 0.16)";
      div.style.border = "1px solid rgba(59, 130, 246, 0.35)";
    } else {
      div.style.background = "rgba(148, 163, 184, 0.14)";
      div.style.border = "1px solid rgba(148, 163, 184, 0.28)";
    }

    const label = document.createElement("strong");
    label.textContent = (role === "user" ? "Você: " : "Kael: ");
    const texto = document.createElement("span");
    texto.textContent = String(content || "");
    div.appendChild(label);
    div.appendChild(texto);
    return div;
  }

  async function carregarHistoricoKael() {
    try {
      const container = acharContainerChat();
      if (!container) return;
      const resp = await fetch("/chat/historico?limit=60", { cache: "no-store" });
      if (!resp.ok) return;
      const data = await resp.json();
      const msgs = Array.isArray(data.mensagens) ? data.mensagens : [];
      if (!msgs.length) return;

      const existentes = new Set(
        Array.from(container.querySelectorAll("[data-kael-hist='1'], .message, .msg, .chat-msg")).map(
          (n) => (n.textContent || "").trim().slice(-120)
        )
      );

      let adicionou = false;
      for (const m of msgs) {
        if (!m || !m.content) continue;
        const role = m.role === "assistant" ? "assistant" : "user";
        const content = String(m.content).trim();
        if (!content) continue;
        const chave = ((role === "user" ? "Você: " : "Kael: ") + content).trim().slice(-120);
        if (existentes.has(chave)) continue;
        container.appendChild(criarBolha(role, content));
        existentes.add(chave);
        adicionou = true;
      }
      if (adicionou) {
        container.scrollTop = container.scrollHeight;
      }
    } catch (_e) {
      // Silencioso no Termux/navegador offline
    }
  }

  if (document.readyState === "loading") {

<script>
(function() {
  function anexarMsgLocal(textoHtml) {
    const box = document.querySelector("#chat, #messages, .chat-messages, .messages");
    if (!box) return;
    const div = document.createElement("div");
    div.className = "msg assistant";
    div.style.margin = "8px 0";
    div.style.padding = "10px 12px";
    div.style.borderRadius = "10px";
    div.style.background = "rgba(148, 163, 184, 0.14)";
    div.style.border = "1px solid rgba(148, 163, 184, 0.28)";
    div.innerHTML = textoHtml;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  window.kaelRodarSandboxAgora = async function() {
    anexarMsgLocal("<b>Kael Sandbox:</b> Executando bateria de testes em <code>~/Kael_ia/sandbox_testes/</code>...");
    try {
      const r = await fetch("/sandbox/rodar", { method: "POST" });
      const d = await r.json();
      const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      anexarMsgLocal(`<b>Kael Sandbox (${d.ok ? "APROVADO ✅" : "REPROVADO ❌"}):</b><pre style="white-space:pre-wrap;margin-top:6px;">${esc(d.saida)}</pre>`);
    } catch (e) {
      anexarMsgLocal("<b>Kael Sandbox:</b> Erro ao rodar testes: " + String(e.message || e));
    }
  };

  window.kaelListarArquivosAgora = async function() {
    try {
      const r = await fetch("/sandbox/arquivos");
      const d = await r.json();
      anexarMsgLocal(
        `<b>Arquivos reais no disco:</b><br>` +
        `• <code>~/Kael_ia</code>: ${(d.kael || []).join(", ")}<br>` +
        `• <code>~/Projetos/Ecos_de_Aethelgard</code>: ${(d.ecos || []).join(", ") || "(vazia)"}`
      );
    } catch (e) {
      anexarMsgLocal("<b>Erro ao listar arquivos:</b> " + String(e.message || e));
    }
  };

  window.kaelCopiarBloco = function(btn) {
    const pre = btn.closest(".kael-code-wrap").querySelector("pre");
    if (!pre) return;
    navigator.clipboard.writeText(pre.innerText).then(() => {
      btn.innerText = "Copiado!";
      setTimeout(() => { btn.innerText = "Copiar"; }, 1500);
    });
  };

  function aprimorarBlocosCodigo() {
    const box = document.querySelector("#chat, #messages, .chat-messages, .messages");
    if (!box) return;
    box.querySelectorAll("pre").forEach((pre) => {
      if (pre.closest(".kael-code-wrap")) return;
      const wrap = document.createElement("div");
      wrap.className = "kael-code-wrap";
      const head = document.createElement("div");
      head.className = "kael-code-head";
      head.innerHTML = '<span>Código</span><button type="button" class="kael-copy-btn" onclick="kaelCopiarBloco(this)">Copiar</button>';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(head);
      wrap.appendChild(pre);
    });
  }

  function montarQuickbar() {
    if (document.getElementById("kaelQuickbar")) return;
    const ta = document.getElementById("prompt") || document.querySelector("textarea");
    if (!ta || !ta.parentElement) return;
    const bar = document.createElement("div");
    bar.id = "kaelQuickbar";
    bar.className = "kael-quickbar";
    bar.innerHTML = `
      <button type="button" class="kael-qbtn" onclick="kaelRodarSandboxAgora()">🧪 Testar Códigos</button>
      <button type="button" class="kael-qbtn" onclick="kaelListarArquivosAgora()">📂 Ver Arquivos</button>
      <button type="button" class="kael-qbtn" onclick="enviarParaChatConversa('Crie um rascunho de script na sandbox_testes/candidatos e me explique como validar.')">✨ Novo Código na Sandbox</button>
      <button type="button" class="kael-qbtn" onclick="enviarParaChatConversa('Analise os arquivos atuais de ~/Projetos/Ecos_de_Aethelgard e sugira o próximo script Luau.')">🎮 Ecos de Aethelgard</button>
    `;
    ta.parentElement.parentElement.insertBefore(bar, ta.parentElement);
  }

  window.addEventListener("load", () => {
    montarQuickbar();
    aprimorarBlocosCodigo();
    const box = document.querySelector("#chat, #messages, .chat-messages, .messages");
    if (box) {
      new MutationObserver(aprimorarBlocosCodigo).observe(box, { childList: true, subtree: true });
    }
  });
})();
</script>


<script>
(function() {
  var wakeAtivo = false;
  var wakeRec = null;

  function normalizarFalaKael(txt) {
    return String(txt || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[,!.?;:]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function extrairComandoWakeKael(bruto) {
    var norm = normalizarFalaKael(bruto);
    var gatilhos = ["ei kael", "hey kael", "oi kael", "ok kael"];
    for (var i = 0; i < gatilhos.length; i++) {
      var g = gatilhos[i];
      var pos = norm.indexOf(g);
      if (pos !== -1) {
        var resto = norm.slice(pos + g.length).trim();
        return resto || "Estou aqui, pode falar.";
      }
    }
    return null;
  }

  window.alternarWakeWordKael = function() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var btn = document.getElementById("wakeBtn");
    if (!SR) {
      if (btn) btn.innerText = "Ei, Kael: N/D";
      return;
    }
    if (wakeAtivo) {
      wakeAtivo = false;
      try { if (wakeRec) wakeRec.stop(); } catch (e) {}
      if (btn) btn.innerText = "Ei, Kael: OFF";
      return;
    }
    wakeAtivo = true;
    if (btn) btn.innerText = "Ei, Kael: ON";

    function iniciarCicloWake() {
      if (!wakeAtivo) return;
      wakeRec = new SR();
      wakeRec.lang = "pt-BR";
      wakeRec.continuous = false;
      wakeRec.interimResults = false;
      wakeRec.onresult = function(ev) {
        var res = ev.results && ev.results[0] && ev.results[0][0];
        var fala = res ? res.transcript : "";
        var cmd = extrairComandoWakeKael(fala);
        if (cmd && typeof enviar === "function") {
          enviar(cmd);
        }
      };
      wakeRec.onend = function() {
        if (wakeAtivo) {
          setTimeout(iniciarCicloWake, 450);
        }
      };
      wakeRec.onerror = function() {
        if (wakeAtivo) {
          setTimeout(iniciarCicloWake, 1500);
        }
      };
      try { wakeRec.start(); } catch (e) {}
    }
    iniciarCicloWake();
  };

  window.atualizarEstadoSleepKael = async function() {
    var btn = document.getElementById("sleepBtn");
    if (!btn || document.hidden) return;
    try {
      var r = await fetch("/kael-sleep");
      if (!r.ok) return;
      var d = await r.json();
      btn.innerText = d.estado === "ACORDADO" ? "8080: ATIVO" : "8080: SLEEP";
    } catch (e) {}
  };

  window.alternarSleepKael = async function() {
    var btn = document.getElementById("sleepBtn");
    var acao = (btn && btn.innerText.indexOf("ATIVO") !== -1) ? "dormir" : "acordar";
    if (btn) btn.innerText = "8080: ...";
    try {
      var r = await fetch("/kael-sleep", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ acao: acao })
      });
      if (r.ok) {
        var d = await r.json();
        if (btn) btn.innerText = d.estado === "ACORDADO" ? "8080: ATIVO" : "8080: SLEEP";
      }
    } catch (e) {}
  };

  setInterval(function() {
    if (!document.hidden) window.atualizarEstadoSleepKael();
  }, 30000);
  setTimeout(window.atualizarEstadoSleepKael, 1500);
})();
</script>

<script id="kaelMobileV3Script">
(function() {
  function reorganizarComposerV3() {
    var promptEl = document.getElementById("prompt");
    var sendEl = document.getElementById("send");
    if (!promptEl || !sendEl || document.getElementById("kaelComposerV3")) return;

    var parentAntigo = promptEl.parentElement;
    var composer = document.createElement("div");
    composer.id = "kaelComposerV3";

    var drawer = document.createElement("div");
    drawer.id = "kaelDrawerV3";

    var row = document.createElement("div");
    row.id = "kaelInputRowV3";

    var toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.id = "kaelToggleDrawerBtn";
    toggleBtn.title = "Ferramentas, Voz e Atalhos";
    toggleBtn.textContent = "+";
    toggleBtn.onclick = function() {
      drawer.classList.toggle("aberto");
      toggleBtn.textContent = drawer.classList.contains("aberto") ? "×" : "+";
    };

    // Move botões auxiliares (micBtn, wakeBtn, sleepBtn, config, quickbar) para a gaveta retrátil
    ["micBtn", "wakeBtn", "sleepBtn"].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) drawer.appendChild(el);
    });

    // Move outros botões soltos da barra antiga e pílulas de atalho para a gaveta
    if (parentAntigo) {
      var extras = Array.from(parentAntigo.querySelectorAll("button"));
      extras.forEach(function(b) {
        if (b !== sendEl && b !== toggleBtn && !drawer.contains(b)) {
          drawer.appendChild(b);
        }
      });
    }

    document.querySelectorAll("button").forEach(function(b) {
      var txt = (b.textContent || "").trim();
      if (["Testar Códigos", "Ver Arquivos", "Novo Código na Sandbox", "Ecos de Aethelgard", "Config"].some(function(k) { return txt.indexOf(k) !== -1; })) {
        if (!drawer.contains(b)) drawer.appendChild(b);
      }
    });

    promptEl.placeholder = "Escreva para o Kael...";
    row.appendChild(toggleBtn);
    row.appendChild(promptEl);
    row.appendChild(sendEl);

    composer.appendChild(drawer);
    composer.appendChild(row);

    document.body.appendChild(composer);
    if (parentAntigo && parentAntigo.children.length === 0) {
      parentAntigo.style.display = "none";
    }
  }

  function limparPrefixosBolhas() {
    var chat = document.getElementById("chat");
    if (!chat) return;
    Array.from(chat.children).forEach(function(div) {
      var txt = (div.textContent || "").trim();
      if (txt.startsWith("Você:")) {
        div.classList.add("user");
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function() {
      reorganizarComposerV3();
      limparPrefixosBolhas();
    });
  } else {
    reorganizarComposerV3();
    limparPrefixosBolhas();
  }

  var obs = new MutationObserver(function() { limparPrefixosBolhas(); });
  window.addEventListener("load", function() {
    var chat = document.getElementById("chat");
    if (chat) obs.observe(chat, { childList: true });
  });
})();
</script>

<script id="kaelMobileV4Script">
(function() {
  function aplicarVisaoLimpaV4() {
    var sendEl = document.getElementById("send");
    if (sendEl && sendEl.textContent.trim() === "Enviar") {
      sendEl.textContent = "↑";
      sendEl.title = "Enviar mensagem";
    }

    // Move qualquer botão de atalho criado tardiamente para dentro da gaveta '+'
    var drawer = document.getElementById("kaelDrawerV3");
    if (drawer) {
      var palavrasAtalho = ["Testar Códigos", "Ver Arquivos", "Novo Código", "Ecos de Aethelgard", "Config", "Voz", "Ei, Kael", "8080:"];
      document.querySelectorAll("button").forEach(function(btn) {
        if (btn.id === "send" || btn.id === "kaelToggleDrawerBtn") return;
        var txt = (btn.textContent || "").trim();
        var ehAtalho = palavrasAtalho.some(function(p) { return txt.indexOf(p) !== -1; });
        if (ehAtalho && !drawer.contains(btn)) {
          var pai = btn.parentElement;
          drawer.appendChild(btn);
          if (pai && pai.children.length === 0 && pai.id !== "chat") {
            pai.style.display = "none";
          }
        }
      });

    // Compacta a linha "Pasta / Projeto:" em uma pílula discreta no topo
    var alvoInput = document.getElementById("alvoPath");
    var header = document.querySelector("header, .topbar, .header");
    if (alvoInput && header && !document.getElementById("kaelProjPillV4")) {
      var linhaPasta = alvoInput.parentElement;
      var pill = document.createElement("button");
      pill.type = "button";
      pill.id = "kaelProjPillV4";
      var atualizarPill = function() {
        var val = (alvoInput.value || "").replace(/\/+$/, "");
        var nome = val.split("/").pop() || "Kael_ia";
        pill.textContent = "📁 " + nome;
        pill.title = val;
      };
      atualizarPill();
      pill.onclick = function() {
        if (linhaPasta) {
          linhaPasta.style.display = (linhaPasta.style.display === "none") ? "flex" : "none";
        }
      };
      header.insertBefore(pill, header.lastElementChild);
      if (linhaPasta && linhaPasta !== header) {
        linhaPasta.style.display = "none";
      }
      alvoInput.addEventListener("change", atualizarPill);
    }

    // Remove prefixos redundantes "Você:" e "Kael:" nas bolhas
    var chat = document.getElementById("chat");
    if (chat) {
      Array.from(chat.children).forEach(function(div) {
        if (div.dataset.v4Cleaned === "1") return;
        var htmlInner = div.innerHTML || "";
        var txt = (div.textContent || "").trim();
        if (txt.startsWith("Você:")) {
          div.classList.add("user");
          div.innerHTML = htmlInner.replace(/^\s*(?:<[^>]+>)*\s*Você:\s*(?:<\/[^>]+>)?\s*/i, "");
        } else if (txt.startsWith("Kael:")) {
          div.innerHTML = htmlInner.replace(/^\s*(?:<[^>]+>)*\s*Kael:\s*(?:<\/[^>]+>)?\s*/i, "");
        }
        div.dataset.v4Cleaned = "1";
      });
    }
  }

  window.addEventListener("load", function() {
    aplicarVisaoLimpaV4();
    setTimeout(aplicarVisaoLimpaV4, 250);
    setTimeout(aplicarVisaoLimpaV4, 800);
    var obs = new MutationObserver(aplicarVisaoLimpaV4);
    obs.observe(document.body, { childList: true, subtree: true });
  });
})();
</script>


<script id="kaelEnterNewlineScript">
(function() {
  function configurarEnterQuebraLinha() {
    var promptEl = document.getElementById("prompt");
    if (!promptEl || promptEl.dataset.enterNewlineOk === "1") return;

    promptEl.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {

          promptEl.style.height = "auto";
          promptEl.style.height = Math.min(promptEl.scrollHeight, 130) + "px";
        }, 0);
      }
    }, true);

    promptEl.dataset.enterNewlineOk = "1";
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", configurarEnterQuebraLinha);
  } else {
    configurarEnterQuebraLinha();
  }
  window.addEventListener("load", configurarEnterQuebraLinha);
})();

<script id="kaelDedupBolhaScript">
(function() {
  var origAdd = window.adicionarMensagem;
  var ultimaMsg = "", ultimoTs = 0;
  if (typeof origAdd === "function" && !origAdd._dedupOk) {
    window.adicionarMensagem = function(remetente, texto) {
      var agora = Date.now();
      var chave = String(remetente) + "|" + String(texto).trim();
      if (chave === ultimaMsg && (agora - ultimoTs) < 1200) return;
      ultimaMsg = chave;
      ultimoTs = agora;
      return origAdd.apply(this, arguments);
    };
    window.adicionarMensagem._dedupOk = true;
  }
})();
</script>


<script id="kael-ui-v5-script">
(function() {
  function escHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  window.kaelCopiarTexto = async function(txt, btnEl) {
    const raw = String(txt || "");
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(raw);
      } else {
        throw new Error("no clipboard");
      }
    } catch (_) {
      const ta = document.createElement("textarea");
      ta.value = raw;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    if (btnEl) {
      const orig = btnEl.textContent;
      btnEl.textContent = "Copiado";
      setTimeout(() => { btnEl.textContent = orig; }, 1400);
    }
  };

  window.kaelFormatarHtml = function(texto) {
    const srcTxt = String(texto || "");
    const blocos = [];
    const comPlaceholders = srcTxt.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(_, lang, cod) {
      const idx = blocos.length;
      const nomeLang = (lang || "codigo").trim();
      const codLimpo = cod.replace(/\n$/, "");
      blocos.push(
        `<div class="kael-code-box"><div class="kael-code-head"><span>${escHtml(nomeLang)}</span><button type="button" class="kael-act-btn" data-copy-idx="${idx}">Copiar código</button></div><pre><code>${escHtml(codLimpo)}</code></pre></div>` ); return `@@KAELBLOCK_${idx}@@`;
    });

    let html = escHtml(comPlaceholders)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`\n]+)`/g, '<code class="kael-inline-code">$1</code>')
      .replace(/\n/g, "<br>");

    html = html.replace(/@@KAELBLOCK_(\d+)@@/g, function(_, i) {
      return blocos[Number(i)] || "";
    });
    return html;
  };

  function atualizarBotoesEditar() {
    const box = document.querySelector("#chat, #messages, .chat-messages, .messages");
    if (!box) return;
    box.querySelectorAll(".kael-btn-editar-ultima").forEach(b => b.remove());
    const userBtns = box.querySelectorAll("[data-kael-role=\"user\"] .kael-msg-actions");
    if (!userBtns.length) return;
    const ultimaBarra = userBtns[userBtns.length - 1];
    const btnEdit = document.createElement("button");
    btnEdit.type = "button";
    btnEdit.className = "kael-act-btn kael-btn-editar-ultima";
    btnEdit.textContent = "Editar";
    btnEdit.onclick = function() {
      const msgEl = ultimaBarra.closest("[data-kael-raw]");
      const textoAntigo = msgEl ? (msgEl.getAttribute("data-kael-raw") || "") : "";
      const input = document.querySelector("textarea, #prompt, #input, input[type=\"text\"]");
      if (input) {
        input.value = textoAntigo;
        input.focus();
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
      if (msgEl) {
        const prox = msgEl.nextElementSibling;
        if (prox && prox.getAttribute("data-kael-role") === "assistant") {
          prox.remove();
        }
        msgEl.remove();
        atualizarBotoesEditar();
      }
    };
    ultimaBarra.prepend(btnEdit);
  }

  function enriquecerMensagens() {
    const box = document.querySelector("#chat, #messages, .chat-messages, .messages");
    if (!box) return;
    const filhos = Array.from(box.children);
    filhos.forEach(el => {
      if (el.getAttribute("data-kael-v5") === "1") return;
      const txt = (el.innerText || "").trim();
      if (!txt) return;
      const isUser = /user|usuario|eu/i.test(el.className || "") || el.style.marginLeft === "auto";
      const role = isUser ? "user" : "assistant";
      el.setAttribute("data-kael-v5", "1");
      el.setAttribute("data-kael-role", role);
      el.setAttribute("data-kael-raw", txt);

      if (!isUser && (txt.includes("**") || txt.includes("```") || txt.includes("`"))) {
        el.innerHTML = window.kaelFormatarHtml(txt);
        el.querySelectorAll("[data-copy-idx]").forEach(btnCode => {
          const idx = Number(btnCode.getAttribute("data-copy-idx"));
          const matchCod = txt.match(/```[a-zA-Z0-9_-]*\n([\s\S]*?)```/g);
          const blocoStr = matchCod && matchCod[idx] ? matchCod[idx].replace(/^```[^\n]*\n|\n```$/g, "") : txt;
          btnCode.onclick = function(ev) {
            ev.stopPropagation();
            window.kaelCopiarTexto(blocoStr, btnCode);
          };
        });
      }

      const bar = document.createElement("div");
      bar.className = "kael-msg-actions";
      const btnCopy = document.createElement("button");
      btnCopy.type = "button";
      btnCopy.className = "kael-act-btn";
      btnCopy.textContent = "Copiar";
      btnCopy.onclick = function(ev) {
        ev.stopPropagation();
        window.kaelCopiarTexto(el.getAttribute("data-kael-raw") || txt, btnCopy);
      };
      bar.appendChild(btnCopy);
      el.appendChild(bar);
    });
    atualizarBotoesEditar();
  }

  const obs = new MutationObserver(() => {
    clearTimeout(window._kaelV5Timer);
    window._kaelV5Timer = setTimeout(enriquecerMensagens, 60);
  });
  window.addEventListener("DOMContentLoaded", () => {
    enriquecerMensagens();
    const box = document.querySelector("#chat, #messages, .chat-messages, .messages");
    if (box) obs.observe(box, { childList: true, subtree: true });
  });
  setInterval(enriquecerMensagens, 1500);
})();
</script>


<script>
(function() {
  if (window._kaelMultiVozAtivo) return;
  window._kaelMultiVozAtivo = true;

  const perfisVoz = {
    natural:  { rate: 1.0,  pitch: 1.0 },
    calmo:    { rate: 0.88, pitch: 0.9 },
    agil:     { rate: 1.15, pitch: 1.05 },
    narrador: { rate: 0.94, pitch: 0.82 }
  };

  let estadoVoz = {
    perfil: "natural",
    voz_nome: "",
    rate: 1.0,
    pitch: 1.0,
    auto_falar: false
  };
  let ultimoTextoFalado = "";

  function carregarVozesBrowser() {
    const sel = document.getElementById("kaelVozSelect");
    if (!sel || !("speechSynthesis" in window)) return;
    const vozes = window.speechSynthesis.getVoices() || [];
    if (!vozes.length) return;
    const atual = estadoVoz.voz_nome || sel.value || "";
    const ordenadas = [...vozes].sort((a, b) => {
      const apt = (a.lang || "").toLowerCase().startsWith("pt") ? 0 : 1;
      const bpt = (b.lang || "").toLowerCase().startsWith("pt") ? 0 : 1;
      return apt - bpt || String(a.name).localeCompare(String(b.name));
    });
    sel.innerHTML = '<option value="">Voz do sistema (auto)</option>';
    ordenadas.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      if (v.name === atual) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function atualizarBotaoAutoVoz() {
    const btn = document.getElementById("kaelBtnAutoVoz");
    if (!btn) return;
    btn.textContent = estadoVoz.auto_falar ? "Voz Auto: ON" : "Voz Auto: OFF";
  }

  function sincronizarControles() {
    const pSel = document.getElementById("kaelVozPerfil");
    const vSel = document.getElementById("kaelVozSelect");
    if (pSel && perfisVoz[estadoVoz.perfil]) pSel.value = estadoVoz.perfil;
    if (vSel && estadoVoz.voz_nome) vSel.value = estadoVoz.voz_nome;
    atualizarBotaoAutoVoz();
  }

  async function persistirConfigVoz() {
    try {
      await fetch("/voz/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(estadoVoz)
      });
    } catch (_) {}
  }

  window.kaelAplicarPerfilVoz = function(perfil) {
    const cfg = perfisVoz[perfil] || perfisVoz.natural;
    estadoVoz.perfil = perfisVoz[perfil] ? perfil : "natural";
    estadoVoz.rate = cfg.rate;
    estadoVoz.pitch = cfg.pitch;
    sincronizarControles();
    persistirConfigVoz();
  };

  window.kaelSalvarVozSelecionada = function() {
    const vSel = document.getElementById("kaelVozSelect");
    estadoVoz.voz_nome = vSel ? vSel.value : "";
    persistirConfigVoz();
  };

  window.kaelAlternarAutoVoz = function() {
    estadoVoz.auto_falar = !estadoVoz.auto_falar;
    atualizarBotaoAutoVoz();
    persistirConfigVoz();
  };

  window.kaelFalarTexto = function(texto) {
    const limpo = String(texto || "")
      .replace(/```[\s\S]*?```/g, " trecho de código ")
      .replace(/[#*_`>]+/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 650);
    if (!limpo) return;

    if ("speechSynthesis" in window) {
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(limpo);
        const vozes = window.speechSynthesis.getVoices() || [];
        const escolhida = vozes.find(v => v.name === estadoVoz.voz_nome)
          || vozes.find(v => (v.lang || "").toLowerCase().startsWith("pt-br"))
          || vozes.find(v => (v.lang || "").toLowerCase().startsWith("pt"));
        if (escolhida) utter.voice = escolhida;
        utter.lang = escolhida ? escolhida.lang : "pt-BR";
        utter.rate = Number(estadoVoz.rate) || 1.0;
        utter.pitch = Number(estadoVoz.pitch) || 1.0;
        window.speechSynthesis.speak(utter);
        return;
      } catch (_) {}
    }
  };

  window.kaelFalarUltimaResposta = function() {
    const rawEls = document.querySelectorAll("[data-kael-raw]");
    const ultimo = rawEls.length ? rawEls[rawEls.length - 1].getAttribute("data-kael-raw") : "";
    if (ultimo) window.kaelFalarTexto(ultimo);
  };

  function checarAutoFala() {
    if (!estadoVoz.auto_falar) return;
    const rawEls = document.querySelectorAll("[data-kael-raw]");
    if (!rawEls.length) return;
    const ultimo = rawEls[rawEls.length - 1].getAttribute("data-kael-raw") || "";
    if (ultimo && ultimo !== ultimoTextoFalado) {
      ultimoTextoFalado = ultimo;
      window.kaelFalarTexto(ultimo);
    }
  }

  window.addEventListener("DOMContentLoaded", async () => {
    carregarVozesBrowser();
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = carregarVozesBrowser;
    }
    try {
      const r = await fetch("/voz/config");
      if (r.ok) {
        const j = await r.json();
        if (j && j.config) estadoVoz = Object.assign(estadoVoz, j.config);
      }
    } catch (_) {}
    carregarVozesBrowser();
    sincronizarControles();
    setInterval(checarAutoFala, 1200);
  });
})();
</script>


<script>
(function() {
  let kaelController = null;
  let kaelTimer = null;
  let kaelInicio = 0;

  function garantirBotaoCancelar() {
    if (document.getElementById("kael-btn-cancelar")) return;
    const form = document.querySelector("form");
    const sendBtn = document.querySelector("button[type='submit'], #send-btn, .send-btn");
    const host = (sendBtn && sendBtn.parentElement) || form || document.body;
    const btn = document.createElement("button");
    btn.id = "kael-btn-cancelar";
    btn.type = "button";
    btn.textContent = "Cancelar";
    btn.style.cssText = "display:none;margin-left:8px;padding:8px 12px;border-radius:8px;border:1px solid #ef4444;background:#7f1d1d;color:#fff;font-size:13px;cursor:pointer;";
    btn.onclick = async function() {
      if (kaelController) { try { kaelController.abort(); } catch (_) {} }
      try { await fetch("/chat/cancel", { method: "POST" }); } catch (_) {}
      pararProgresso("Cancelado pelo usuário.");
    };
    if (sendBtn && sendBtn.insertAdjacentElement) {
      sendBtn.insertAdjacentElement("afterend", btn);
    } else {
      host.appendChild(btn);
    }
  }

  function atualizarBolhaPensando(texto) {
    const nodes = Array.from(document.querySelectorAll("*"));
    for (let i = nodes.length - 1; i >= 0; i--) {
      const el = nodes[i];
      if (el.children.length === 0 && typeof el.textContent === "string") {
        const t = el.textContent.trim();
        if (t === "Pensando..." || t.startsWith("Trabalhando...") || t === "Cancelado pelo usuário.") {
          el.textContent = texto;
          return;
        }
      }
    }
  }

  function iniciarProgresso() {
    garantirBotaoCancelar();
    const btn = document.getElementById("kael-btn-cancelar");
    if (btn) btn.style.display = "inline-block";
    kaelController = new AbortController();
    kaelInicio = Date.now();
    clearInterval(kaelTimer);
    kaelTimer = setInterval(async () => {
      const seg = Math.floor((Date.now() - kaelInicio) / 1000);
      let etapa = "processando pedido";
      try {
        const r = await fetch("/chat/status", { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          if (d.etapa) etapa = d.etapa;
        }
      } catch (_) {}
      atualizarBolhaPensando(`Trabalhando... ${seg}s (${etapa})`);
    }, 1000);
  }

  function pararProgresso(msgFinal) {
    clearInterval(kaelTimer);
    kaelTimer = null;
    kaelController = null;
    const btn = document.getElementById("kael-btn-cancelar");
    if (btn) btn.style.display = "none";
    if (msgFinal) atualizarBolhaPensando(msgFinal);
  }

  const origFetch = window.fetch;
  window.fetch = function(input, init) {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.includes("/chat") && !url.includes("/chat/status") && !url.includes("/chat/cancel")) {
      iniciarProgresso();
      const nextInit = Object.assign({}, init || {}, { signal: kaelController ? kaelController.signal : undefined });
      return origFetch.call(this, input, nextInit).finally(() => {
        if (typeof pararProgresso === "function") {
          pararProgresso();
        } else {
          clearInterval(kaelTimer);
          kaelTimer = null;
          const btn = document.getElementById("kael-btn-cancelar");
          if (btn) btn.style.display = "none";
        }
      });
    }
    return origFetch.call(this, input, init);
  };

  window.addEventListener("DOMContentLoaded", garantirBotaoCancelar);
  setTimeout(garantirBotaoCancelar, 500);
})();
</script>

  function kaelRenderChunk(tipo, texto) {
    const boxes = document.querySelectorAll(".kael-live-thinking, .kael-live-content");
    if (!boxes.length) return;
    if (tipo === "thinking") {
      const th = document.querySelector(".kael-live-thinking");
      if (th) {
        if (th.parentElement && th.parentElement.tagName === "DETAILS") {
          th.parentElement.style.display = "block";
          th.parentElement.open = true;
        }
        th.textContent = (th.textContent || "") + texto;
      }
    } else if (tipo === "content") {
      const ct = document.querySelector(".kael-live-content");
      if (ct) {
        if (ct.textContent.trim() === "Pensando..." || ct.textContent.trim().startsWith("Trabalhando...")) {
          ct.textContent = "";
        }
        ct.textContent = (ct.textContent || "") + texto;
      }
    }
  }
  window.kaelRenderChunk = kaelRenderChunk;
})();
</script>
