name: Kael CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python3 -m compileall -q . -x "build_termux|__pycache__|\.git"
      - name: Run unit tests
        run: pytest -q || python3 -m unittest discover -s tests -p "test_*.py"
